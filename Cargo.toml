[workspace]
resolver = "2"
members = [
    "crates/bbq-analytics",
    "crates/bbq-api",
    "crates/bbq-auth",
    "crates/bbq-config",
    "crates/bbq-core",
    "crates/bbq-db",
    "crates/bbq-events",
    "crates/bbq-observability",
    "crates/bbq-pi-agent",
    "crates/bbq-pi-client",
    "crates/bbq-protocol",
    "crates/bbq-server",
    "crates/bbq-telemetry",
    "crates/bbq-watch",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "BSD 3-Clause License"
repository = "https://github.com/ssargent/smokehouse"
authors = ["Scott Sargent"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Add shared dependency versions here as crates are created.
anyhow = "1.0"
btleplug = "0.13"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
csv = "1.4"
directories = "6.0"
futures = "0.3"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.29"
